version: 2

models:
  - name: mapping_active_mrn
    description: 'Distinct MRNs with an arrived treatment appointment during the rolling three-month activity window.'

  - name: mapping_ethnic_background
    description: 'Mapping table for all ethnic backgrounds of patients.'
    columns:
      - name: pat_id
        data_tests:
          - unique
  
  - name: oncology_access_bronze
    description: 'Appointment-level oncology access source and mapping joins with only the columns needed downstream; no formatting or filtering.'

  - name: oncology_access_silver
    description: 'Final oncology access base table converted from ONCOLOGY_ACCESS_BASE.sql.'
    columns:
      - name: pat_enc_csn_id
        description: 'Unique appointment encounter identifier defining the grain of this model.'
        data_tests:
          - unique
          - not_null
          
  - name: oncology_access_gold
    description: 'Final oncology access table downstream of oncology_access_silver with active MRN mapping and department/provider inclusion rules.'
    columns:
      - name: pat_enc_csn_id
        description: 'Unique appointment encounter identifier defining the grain of this model.'
        data_tests:
          - unique
          - not_null
