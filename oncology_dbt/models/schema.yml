version: 2

sources:
  - name: oncology
    description: 'source for all OAO owned tables'
    database: opsanalytics_adb_workspace01
    schema: oncology
    tables:
      - name: mapping_department
        description: 'mapping file to link epic IDs to department names and sites'
        columns:
          - name: department_id
            data_tests:
              - unique
      - name: mapping_disease
        description: 'mapping file to link providers to their disease group type'
        columns:
          - name: epic_provider_id
            data_tests:
              - unique
      - name: mapping_ethnicity
        description: 'mapping file to link ethnic background to ethnic group'
        data_tests:
          - unique:
              arguments:
                column_name: "lower(ethnic_background)"
      - name: mapping_los_exclusions
        description: 'mapping file containing los codes to exclude'
        columns:
          - name: los_code
            data_tests:
              - unique
      - name: mapping_mychart_status
        description: 'mapping file to determine whether mychart status is active or not'
        data_tests:
          - unique:
              arguments:
                column_name: "lower(mychart_status)"
      - name: mapping_procedure
        description: 'mapping file to group procedures into categories used for filtering'
        columns:
          - name: prc_name
            data_tests:
              - unique
      - name: mapping_race
        description: 'mapping file used to categorize race for filtering'
        data_tests:
          - unique:
              arguments:
                column_name: "lower(race)"
      - name: mapping_vizient_icd10
        description: 'mapping file to link ICD10 codes to their oncology type'
        columns:
          - name: epic_icd10_code
            data_tests:
              - unique
      - name: mapping_mv_patient_select_demographics
        description: 'mapping table for all patient demographics'
        columns:
          - name: pat_id
            data_tests:
              - unique
  
  - name: msx_clarity
    description: 'source for all MSX Clarity tables owned by DTP'
    database: datahub_dev_bronze
    schema: datahub_clarity
    tables:
      - name: mv_dm_patient_access
        description: 'raw table containing ambulatory visits for entire system'
      - name: ethnic_background
        description: 'raw table containing patient ethnic background codes'
      - name: zc_ethnic_bkgrnd
        description: 'raw lookup table for ethnic background code names'

models:
  - name: mapping_active_mrn
    description: 'Distinct MRNs with an arrived treatment appointment during the rolling three-month activity window.'

  - name: mapping_ethnic_background
    description: 'Mapping table for all ethnic backgrounds of patients.'
    columns:
      - name: pat_id
        data_tests:
          - unique
  
  - name: oncology_access_bronze
    description: 'Appointment-level oncology access source and mapping joins with only the columns needed downstream; no formatting or filtering.'

  - name: oncology_access_silver
    description: 'Final oncology access base table converted from ONCOLOGY_ACCESS_BASE.sql.'
    columns:
      - name: pat_enc_csn_id
        description: 'Unique appointment encounter identifier defining the grain of this model.'
        data_tests:
          - unique
          - not_null
          
  - name: oncology_access_gold
    description: 'Final oncology access table downstream of oncology_access_silver with active MRN mapping and department/provider inclusion rules.'
    columns:
      - name: pat_enc_csn_id
        description: 'Unique appointment encounter identifier defining the grain of this model.'
        data_tests:
          - unique
          - not_null
